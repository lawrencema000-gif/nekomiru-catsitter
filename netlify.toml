# Netlify configuration — ねこみるキャットシッター (static site)
[build]
  publish = "."

# publish = "." serves the whole repo root, which was exposing internal docs at
# /README.md and /docs/*. force = true makes these win over the real files.
[[redirects]]
  from = "/README.md"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*.md"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
